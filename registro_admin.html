<!doctype html>
<html lang="es" data-modo="admin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>APP ECUS 2.0 | Registro ADMIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #0f172a;
      }
      input,
      select {
        color-scheme: dark;
      }
      .photo-tile {
        border: 2px dashed #475569;
        background: #1e293b;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }
      .photo-tile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        inset: 0;
      }
      .remove-photo {
        position: absolute;
        right: 8px;
        top: 8px;
        z-index: 2;
        background: #dc2626;
        color: white;
        border-radius: 999px;
        width: 28px;
        height: 28px;
        display: none;
      }
      .photo-tile.has-photo .remove-photo {
        display: block;
      }
      .photo-tile.has-photo .placeholder {
        display: none;
      }
    </style>
  </head>
  <body class="text-slate-100 min-h-screen py-0 sm:py-8 px-0 sm:px-4">
    <main
      class="max-w-lg mx-auto bg-slate-900 sm:rounded-3xl sm:border sm:border-slate-700 shadow-2xl p-5 sm:p-7"
    >
      <header class="flex items-start justify-between mb-7">
        <div>
          <p
            class="inline-block text-[10px] tracking-widest font-extrabold text-sky-400 bg-sky-500/10 border border-sky-500/20 px-3 py-1 rounded-full"
          >
            APP ECUS 2.0 · MÓDULO DE CAMPO
          </p>
          <h1 class="text-2xl font-extrabold mt-3">Registro de Control · ADMINISTRADOR</h1>
          <p class="text-xs text-slate-400 mt-1">
            Capture los datos y fotografías del registro.
          </p>
        </div>
        <a
          href="index.html"
          class="p-3 rounded-xl bg-slate-800 text-slate-300 hover:text-white"
          title="Volver al inicio"
          ><i class="fa-solid fa-house"></i
        ></a>
      </header>
      <form id="registro-form" class="space-y-4" novalidate>
        <section aria-label="Fotografías">
          <div class="flex justify-between items-center mb-2">
            <label
              class="text-[11px] uppercase font-bold tracking-wider text-slate-400"
              >Fotografías (máximo 4)</label
            ><span id="photo-count" class="text-[11px] text-sky-400"
              >0 / 4</span
            >
          </div>
          <div
            id="photo-main"
            class="photo-tile rounded-2xl h-56 flex items-center justify-center"
            data-index="0"
            role="button"
            tabindex="0"
            aria-label="Seleccionar fotografía principal"
          >
            <div class="placeholder text-center text-slate-400">
              <i class="fa-solid fa-camera text-4xl mb-3"></i>
              <p class="text-sm font-bold">Fotografía principal</p>
              <p class="text-xs mt-1">Toque para seleccionar</p>
            </div>
            <img alt="Fotografía principal" hidden /><button
              type="button"
              class="remove-photo"
              aria-label="Quitar fotografía principal"
            >
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <div class="grid grid-cols-3 gap-3 mt-3">
            <div
              class="photo-tile rounded-xl h-24 flex items-center justify-center"
              data-index="1"
              role="button"
              tabindex="0"
              aria-label="Seleccionar fotografía 2"
            >
              <div class="placeholder text-center text-slate-400">
                <i class="fa-solid fa-camera text-xl"></i>
                <p class="text-[10px] mt-1">Foto 2</p>
              </div>
              <img alt="Foto 2" hidden /><button
                type="button"
                class="remove-photo"
                aria-label="Quitar foto 2"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div
              class="photo-tile rounded-xl h-24 flex items-center justify-center"
              data-index="2"
              role="button"
              tabindex="0"
              aria-label="Seleccionar fotografía 3"
            >
              <div class="placeholder text-center text-slate-400">
                <i class="fa-solid fa-camera text-xl"></i>
                <p class="text-[10px] mt-1">Foto 3</p>
              </div>
              <img alt="Foto 3" hidden /><button
                type="button"
                class="remove-photo"
                aria-label="Quitar foto 3"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
            <div
              class="photo-tile rounded-xl h-24 flex items-center justify-center"
              data-index="3"
              role="button"
              tabindex="0"
              aria-label="Seleccionar fotografía 4"
            >
              <div class="placeholder text-center text-slate-400">
                <i class="fa-solid fa-camera text-xl"></i>
                <p class="text-[10px] mt-1">Foto 4</p>
              </div>
              <img alt="Foto 4" hidden /><button
                type="button"
                class="remove-photo"
                aria-label="Quitar foto 4"
              >
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>
          </div>
          <input type="file" id="photo-input" accept="image/*" class="hidden" />
        </section>
        <div>
          <label for="nombre" class="field-label">Nombre completo</label
          ><input
            id="nombre"
            name="nombre"
            class="field"
            placeholder="Ej. Juan Carlos Pérez"
            required
            maxlength="150"
          />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="documento" class="field-label">Documento / ID</label
            ><input
              id="documento"
              name="documento"
              class="field"
              placeholder="Identificación"
              required
              maxlength="40"
            />
          </div>
          <div>
            <label for="fecha_nacimiento" class="field-label"
              >Fecha nacimiento</label
            ><input
              id="fecha_nacimiento"
              name="fecha_nacimiento"
              type="date"
              class="field"
              required
            />
          </div>
        </div>
        <div>
          <label for="nacionalidad" class="field-label">Nacionalidad</label
          ><input
            id="nacionalidad"
            name="nacionalidad"
            class="field"
            placeholder="Ej. Costarricense"
            required
            maxlength="80"
          />
        </div>
        <div>
          <label for="distrito" class="field-label">Distrito</label
          ><select id="distrito" name="distrito" class="field" required>
            <option value="">Seleccione un distrito</option>
            <option>CARMEN</option>
            <option>MERCED</option>
            <option>HOSPITAL</option>
            <option>CATEDRAL</option>
            <option>ZAPOTE</option>
            <option>SAN FRANCISCO DE DOS RÍOS</option>
            <option>URUCA</option>
            <option>MATA REDONDA</option>
            <option>PAVAS</option>
            <option>HATILLO</option>
            <option>SAN SEBASTIÁN</option>
            <option value="OTRO">OTRO</option>
          </select>
        </div>
        <div id="otro-distrito-wrap" class="hidden">
          <label for="otro_distrito" class="field-label"
            >Especifique el distrito</label
          ><input
            id="otro_distrito"
            name="otro_distrito"
            class="field"
            placeholder="Escriba el distrito"
            maxlength="100"
          />
        </div>
        <div>
          <label for="lugar_consulta" class="field-label"
            >Lugar de consulta</label
          ><input
            id="lugar_consulta"
            name="lugar_consulta"
            class="field"
            placeholder="Ej. Sector, dirección o puesto"
            required
            maxlength="180"
          />
        </div>
        <p
          id="form-message"
          role="status"
          aria-live="polite"
          class="hidden rounded-xl p-3 text-xs"
        ></p>
        <button
          type="submit"
          class="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-extrabold py-4 rounded-2xl flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-paper-plane"></i>Enviar registro
        </button>
        <!-- BOTÓN VER COLAS -->
        <button
          type="button"
          id="btnVerColas"
          class="w-full bg-slate-800 hover:bg-slate-700 text-sky-400 font-bold py-4 px-6 rounded-xl border border-sky-500 transition duration-200 flex items-center justify-center gap-2"
        >
          <i class="fa-solid fa-list-check"></i>
          VER COLAS
        </button>
        <p class="text-center text-[11px] text-slate-500">
          Los datos se guardan en Supabase. Las fotografías son privadas.
        </p>
      </form>
    </main>
    <style>
      .field-label {
        display: block;
        color: #94a3b8;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 7px;
      }
      .field {
        width: 100%;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 14px;
        padding: 13px 14px;
        font-size: 13px;
        color: white;
        outline: none;
      }
      .field:focus {
        border-color: #0ea5e9;
      }
      .field::placeholder {
        color: #64748b;
      }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="supabase-config.js" defer></script>
    <script src="ecus-core.js" defer></script>
    <script src="registro.js" defer></script>
  </body>
</html>
